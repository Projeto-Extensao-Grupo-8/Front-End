name: Build & Push Multi Images

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # FRONTEND (RAIZ DO PROJETO)
      # =========================
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{secrets.DOCKER_USERNAME}}/fdl-frontend:latest
            ${{secrets.DOCKER_USERNAME}}/fdl-frontend:${{ github.sha }}


      # =========================
      # STRAPI
      # =========================
      - name: Build & Push Strapi
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          tags: |
            ${{secrets.DOCKER_USERNAME}}/fdl-strapi:latest
            ${{secrets.DOCKER_USERNAME}}/fdl-strapi:${{ github.sha }}
